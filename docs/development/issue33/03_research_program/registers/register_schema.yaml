          "RETEST",
          "CLOSED",
          "RISK_ACCEPTED"
        ]
      },
      "foreign_keys": {
        "review_event_id": "review_events.review_event_id"
      },
      "canonical_document_foreign_keys": {
        "risk_acceptance_decision_id": "canonical_document_targets.DECISION"
      },
      "conditional_constraints": [
        {
          "id": "REV-OPEN",
          "when": {
            "closure_status": [
              "OPEN",
              "RETEST"
            ]
          },
          "assertions": [
            {
              "operator": "require_empty",
              "fields": [
                "closed_at",
                "risk_acceptance_decision_id"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "closure_status": [
                "OPEN",
                "RETEST"
              ]
            }
          }
        },
        {
          "id": "REV-CLOSED",
          "when": {
            "closure_status": "CLOSED"
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "implemented_revision",
                "retest_result",
                "closed_at"
              ]
            },
            {
              "operator": "require_empty",
              "fields": [
                "risk_acceptance_decision_id"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "closure_status": "CLOSED"
            }
          }
        },
        {
          "id": "REV-RISK-ACCEPTED",
          "when": {
            "closure_status": "RISK_ACCEPTED"
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "residual_risk",
                "risk_acceptance_decision_id",
                "closed_at"
              ]
            },
            {
              "operator": "forbid_values",
              "values": {
                "severity": [
                  "CRITICAL"
                ]
              }
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "closure_status": "RISK_ACCEPTED"
            }
          }
        }
      ],
      "cross_record_constraints": [
        {
          "id": "REV-OUTCOME-CARDINALITY",
          "scope": "review event and findings",
          "assertions": [
            {
              "operator": "exact_count",
              "computed": "findings linked to a NO_FINDING event",
              "count": 0
            },
            {
              "operator": "exists_count",
              "computed": "findings linked to a FINDINGS_RAISED event",
              "minimum": 1
            }
          ],
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "ALL",
            "population": "REVIEW_EVENTS_WITH_FINDINGS"
          }
        },
        {
          "id": "REV-RISK-AUTHORITY",
          "scope": "finding",
          "assertions": [
            {
              "operator": "approved_decision",
              "field": "risk_acceptance_decision_id"
            }
          ],
          "note": "Applies only when closure_status is RISK_ACCEPTED.",
          "applies_when": {
            "kind": "FIELD_EQUALS",
            "field": "closure_status",
            "value": "RISK_ACCEPTED"
          }
        }
      ]
