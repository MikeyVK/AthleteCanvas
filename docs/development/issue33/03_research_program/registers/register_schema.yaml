              ]
            },
            {
              "operator": "target_field_equals",
              "references": "current_equality_assessment_id",
              "field": "assessment_mode",
              "equals_value": "IMPACT_SCREEN"
            },
            {
              "operator": "target_field_equals",
              "references": "current_equality_assessment_id",
