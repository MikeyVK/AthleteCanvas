              "operator": "target_status_in",
              "references": "current_materiality_assessment_id",
              "allowed": [
                "VERIFIED",
                "CHALLENGED"
              ]
            },
            {
              "operator": "target_field_equals",
              "references": "current_materiality_assessment_id",
              "field": "candidate_id",
              "equals_row_field": "candidate_id"
            }
          ],
          "note": "Applies when pointer is nonempty.",
