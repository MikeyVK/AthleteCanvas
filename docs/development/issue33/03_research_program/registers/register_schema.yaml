          "when": {
            "equality_relevance": [
              "NOT_APPLICABLE",
              "NONE_IDENTIFIED",
              "POSSIBLE",
              "MATERIAL"
            ]
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "current_equality_assessment_id"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "equality_relevance": [
                "NOT_APPLICABLE",
                "NONE_IDENTIFIED",
                "POSSIBLE",
                "MATERIAL"
              ]
            }
          }
        },
        {
          "id": "KAND-EQUALITY-BEFORE-TOPOLOGY",
          "when": {
            "status": [
              "TOPOLOGY_REVIEW",
              "RETAINED",
              "MERGED",
              "RECLASSIFIED",
              "HELD",
              "CORRECTED",
              "REJECTED"
