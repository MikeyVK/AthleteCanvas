            {
              "operator": "exact_multi_set",
              "computed": "review_role values of disputed_screening_event_ids",
              "expected": [
                "PRIMARY",
                "SECONDARY"
              ]
            },
            {
              "operator": "target_field_in",
              "field": "prior_event_id",
              "allowed_from_row_field": "disputed_screening_event_ids"
            },
            {
              "operator": "all_distinct",
              "values": [
                "reviewer_context_locator",
                "disputed reviewer_context_locator values"
              ]
            },
            {
              "operator": "field_not_equal",
              "left": "reviewer",
              "right": "each disputed reviewer",
              "applies_when": {
                "kind": "EXPRESSION_IN",
                "expression": "row.reviewer_type",
                "values": [
                  "HUMAN",
                  "HUMAN_AI_HYBRID"
                ]
              }
            }
          ],
          "applies_when": {
            "kind": "FIELD_EQUALS",
            "field": "review_role",
            "value": "ADJUDICATOR"
          }
        },
        {
          "id": "SCR-SUP-STATUS",
          "scope": "screening supersession graph",
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "ALL",
            "population": "SCREENING_SUPERSESSION_CHAINS"
          },
          "assertions": [
            {
              "operator": "target_field_in",
              "computed": "graph-current screening heads",
              "field": "status",
              "allowed": [
                "ACTIVE"
              ]
            },
            {
              "operator": "target_field_in",
              "computed": "noncurrent screening rows",
              "field": "status",
              "allowed": [
                "SUPERSEDED"
              ]
            }
          ]
        }
      ],
      "supersession_constraints": [
        {
          "id": "SCR-SUP",
          "pointer_field": "supersedes_screening_event_id",
          "natural_key_by_role": {
            "PRIMARY": [
              "source_id",
              "workstream_id",
              "stage",
              "review_role"
            ],
            "SECONDARY": [
              "source_id",
              "workstream_id",
              "stage",
              "review_role",
              "verification_basis",
              "prior_event_id"
            ],
            "ADJUDICATOR": [
              "source_id",
              "workstream_id",
              "stage",
              "review_role",
              "disputed_screening_event_ids"
            ]
          },
          "timestamp_field": "reviewed_at",
          "require_acyclic": true,
          "require_strictly_increasing_timestamp": true,
          "current_definition": "no incoming supersedes_screening_event_id",
          "applies_when": {
            "kind": "FIELD_NONEMPTY",
            "field": "supersedes_screening_event_id"
          }
        }
      ],
      "unique_current_constraints": [
        {
          "id": "SCR-ONE-PRIMARY-HEAD",
          "fields": [
            "source_id",
            "workstream_id",
            "stage"
          ],
          "filter": {
            "review_role": "PRIMARY"
          },
          "maximum": 1,
          "current_only": true,
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "ALL",
            "population": "PRIMARY_SCREENING_HEADS"
          }
        }
      ]
    },
