        "identified_count": "integer",
        "deduplicated_count": "integer",
        "title_screened_count": "integer",
        "abstract_screened_count": "integer",
        "full_text_count": "integer",
        "included_count": "integer",
        "excluded_count": "integer",
        "created_at": "date",
        "last_updated": "date",
        "search_design_frozen_at": "datetime"
      },
      "enums": {
        "status": [
          "PROPOSED",
          "PILOT_APPROVED",
          "ACTIVE",
          "SYNTHESIS",
          "REVIEW",
          "CLOSED",
          "HELD"
        ],
        "saturation_status": "saturation_status"
      },
      "multi_value_fields": [
        "layer_ids",
        "affected_interest_ids",
        "research_question_ids",
        "query_review_event_ids",
        "synthesis_ids",
        "synthesis_paths",
        "screening_sample_record_ids",
        "saturation_iteration_ids"
      ],
      "multi_value_foreign_keys": {
        "affected_interest_ids": "interests.interest_id",
        "research_question_ids": "research_questions.research_question_id",
        "synthesis_ids": "syntheses.synthesis_id",
        "query_review_event_ids": "review_events.review_event_id",
        "screening_sample_record_ids": "screening_precommitments.sample_record_id",
        "saturation_iteration_ids": "search_iterations.search_iteration_id"
      },
      "multi_value_enums": {
        "layer_ids": "layers"
      },
      "conditional_constraints": [
        {
          "id": "WS-FREEZE-GATE",
          "when": {
            "status": [
              "PILOT_APPROVED",
              "ACTIVE",
              "SYNTHESIS",
              "REVIEW",
              "CLOSED"
            ]
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "search_design_frozen_at"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "status": [
                "PILOT_APPROVED",
                "ACTIVE",
                "SYNTHESIS",
                "REVIEW",
                "CLOSED"
              ]
            }
          }
        },
        {
          "id": "WS-SATURATION-PROVISIONAL",
          "when": {
            "saturation_status": "PROVISIONAL"
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "saturation_iteration_ids"
              ]
            },
            {
              "operator": "multi_min_items",
              "field": "saturation_iteration_ids",
              "minimum": 3
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "saturation_status": "PROVISIONAL"
            }
          }
        },
        {
          "id": "WS-SATURATION-NO-POINTER",
          "when": {
            "saturation_status": [
              "NOT_ASSESSED",
              "NOT_REACHED"
            ]
          },
          "assertions": [
            {
              "operator": "require_empty",
              "fields": [
                "saturation_iteration_ids"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "saturation_status": [
                "NOT_ASSESSED",
                "NOT_REACHED"
              ]
            }
          }
        }
      ],
      "cross_record_constraints": [
        {
          "id": "WS-FREEZE-BEFORE-EXECUTION",
          "scope": "workstream",
          "assertions": [
            {
              "operator": "earlier_or_equal",
              "left": "workstreams.search_design_frozen_at",
              "right": "min(searches.executed_at same workstream)"
            },
            {
              "operator": "earlier_or_equal",
              "left": "workstreams.search_design_frozen_at",
              "right": "min(screening_precommitments.recorded_at where same workstream and record_state==PRECOMMITTED)"
            }
          ],
          "note": "Applicable once the workstream reaches PILOT_APPROVED.",
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "status",
            "values": [
              "PILOT_APPROVED",
              "ACTIVE",
              "SYNTHESIS",
              "REVIEW",
              "CLOSED"
            ]
          }
        },
        {
          "id": "WS-SATURATION-PROOF",
          "scope": "workstream",
          "assertions": [
            {
              "operator": "exact_count",
              "set": "saturation_iteration_ids",
              "count": 3
            },
            {
              "operator": "current_head",
              "references": "saturation_iteration_ids"
            },
            {
              "operator": "target_status_in",
              "references": "saturation_iteration_ids",
              "allowed": [
                "VERIFIED"
              ]
            },
            {
              "operator": "target_field_in",
              "references": "saturation_iteration_ids",
              "field": "iteration_result",
              "allowed": [
                "NULL_YIELD"
              ]
            },
            {
              "operator": "same_value",
              "references": "saturation_iteration_ids",
              "field": "workstream_id",
              "equals_row_field": "workstream_id"
