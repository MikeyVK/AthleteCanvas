                "value": "INVALIDATED"
              }
            }
          ],
          "note": "Applies to MATERIALIZED, VERIFIED, and INVALIDATED descendants where semantically applicable.",
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "record_state",
            "values": [
              "MATERIALIZED",
              "VERIFIED",
              "INVALIDATED"
            ]
          }
        },
        {
          "id": "SSP-MATERIALIZED-POPULATION",
          "scope": "MATERIALIZED sample record",
          "assertions": [
            {
              "operator": "exact_multi_set",
              "field": "eligible_screening_event_ids",
              "computed": "all current-as-of population_snapshot_commit PRIMARY EXCLUDE ACTIVE screening events in same workstream/stage with reviewed_at<=population_cutoff_at, ASCII ID order"
            },
            {
              "operator": "computed_equals",
              "field": "population_size",
              "expression": "count eligible_screening_event_ids"
            },
            {
              "operator": "computed_equals",
              "field": "selected_screening_event_ids",
              "expression": "first required_sample_size events under SSP-SELECT-V1 sort"
            },
            {
              "operator": "later_than",
              "left": "recorded_at",
              "right": "population_cutoff_at"
            },
            {
              "operator": "sha256_canonical_equals",
              "field": "seed_commitment",
              "serialization": "SSP-COMMIT-V1"
            }
          ],
          "applies_when": {
            "kind": "FIELD_EQUALS",
            "field": "record_state",
            "value": "MATERIALIZED"
          }
        },
        {
          "id": "SSP-VERIFICATION",
          "scope": "VERIFIED sample record",
          "assertions": [
            {
              "operator": "exists_count",
              "references": "verification_review_event_ids",
              "minimum": 1
            },
            {
              "operator": "target_field_in",
              "references": "verification_review_event_ids",
              "field": "review_type",
              "allowed": [
                "SCREENING_SAMPLE_REVIEW"
              ]
            },
            {
              "operator": "target_field_in",
              "references": "verification_review_event_ids",
              "field": "outcome",
              "allowed": [
                "NO_FINDING"
              ]
            },
            {
              "operator": "target_field_in",
              "references": "verification_review_event_ids",
              "field": "status",
              "allowed": [
                "COMPLETED"
              ]
            },
            {
              "operator": "target_field_equals",
              "references": "verification_review_event_ids",
              "field": "object_id",
              "equals": "prior MATERIALIZED sample_record_id"
            },
            {
              "operator": "target_field_in",
              "references": "verification_review_event_ids",
              "field": "reviewer_procedurally_independent",
              "allowed": [
                "TRUE"
              ]
            },
            {
              "operator": "target_metadata_matches",
              "references": "verification_review_event_ids",
              "target": "prior MATERIALIZED author_fields"
            },
            {
              "operator": "value_not_in_set",
              "value": "verification reviewer_context_locator",
              "set": "PRECOMMITTED, MATERIALIZED, and eligible PRIMARY reviewer_context_locator values"
            },
            {
              "operator": "current_head",
              "references": "verification_review_event_ids"
            },
            {
              "operator": "field_not_equal",
              "left": "verification reviewer",
              "right": "MATERIALIZED recorded_by",
              "applies_when": {
                "kind": "EXPRESSION_IN",
                "expression": "verification review event reviewer_type",
                "values": [
                  "HUMAN",
                  "HUMAN_AI_HYBRID"
                ]
              }
            }
          ],
          "applies_when": {
            "kind": "FIELD_EQUALS",
            "field": "record_state",
            "value": "VERIFIED"
          }
        },
        {
          "id": "SSP-GIT-PRECOMMITMENT",
          "scope": "sample plan",
          "assertions": [
            {
              "operator": "strict_ancestor_commit",
              "ancestor": "commit introducing PRECOMMITTED row",
              "descendant": "every commit introducing a PRIMARY screening event for same workstream/stage"
            },
            {
              "operator": "target_field_equals",
              "field": "population_snapshot_commit",
              "equals": "commit whose register state produces the exact eligible population"
            },
            {
              "operator": "strict_ancestor_commit",
              "ancestor": "commit introducing PRECOMMITTED row",
              "descendant": "population_snapshot_commit"
            }
          ],
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "PILOT-MANIFEST-0.3",
            "population": "SAMPLE_PLAN_WITH_PRIMARY_EVENTS"
          }
        },
        {
          "id": "SSP-CUSTODY-SEPARATION",
          "scope": "sample plan",
          "assertions": [
            {
              "operator": "value_not_in_set",
              "value": "PRECOMMITTED record_context_locator",
              "set": "PRIMARY reviewer_context_locator values in same workstream/stage"
            },
            {
              "operator": "later_than",
              "left": "MATERIALIZED.recorded_at",
              "right": "PRECOMMITTED.population_cutoff_at"
            }
          ],
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "PILOT-MANIFEST-0.3",
            "population": "SAMPLE_PLAN_WITH_PRIMARY_EVENTS"
          }
        },
        {
          "id": "SSP-LATE-EVENT-INVALIDATION",
          "scope": "sample plan",
