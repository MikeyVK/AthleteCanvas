              "operator": "forbid_values",
              "values": {
                "new_candidate_families": [
                  "NONE_IDENTIFIED"
                ]
              }
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "new_candidate_families_state": "NOVEL_YIELD"
            }
          }
        },
        {
          "id": "ITER-category_changing_counterevidence_state-NONE",
          "when": {
            "category_changing_counterevidence_state": "NONE_IDENTIFIED"
          },
          "assertions": [
            {
              "operator": "require_values",
              "values": {
                "category_changing_counterevidence": "NONE_IDENTIFIED"
              }
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "category_changing_counterevidence_state": "NONE_IDENTIFIED"
            }
          }
        },
        {
          "id": "ITER-category_changing_counterevidence_state-NOVEL",
          "when": {
            "category_changing_counterevidence_state": "NOVEL_YIELD"
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "category_changing_counterevidence"
              ]
            },
            {
              "operator": "forbid_values",
              "values": {
                "category_changing_counterevidence": [
                  "NONE_IDENTIFIED"
                ]
              }
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "category_changing_counterevidence_state": "NOVEL_YIELD"
            }
          }
        }
      ],
      "computed_constraints": [
        {
          "id": "ITER-RESULT",
          "target": "iteration_result",
          "expression": "NULL_YIELD iff all five novelty states are NONE_IDENTIFIED; NOVEL_YIELD iff at least one is NOVEL_YIELD; INVALIDATED iff status==INVALIDATED; NOT_ASSESSED iff status==PREDECLARED",
          "allowed_outputs": [
            "NULL_YIELD",
            "NOVEL_YIELD",
            "INVALIDATED",
            "NOT_ASSESSED"
          ],
          "applies_when": {
            "kind": "ALWAYS"
          }
        },
        {
          "id": "ITER-FLOW",
          "target": "identified_count,deduplicated_count,screened_count,included_count",
          "expression": "All four are integers >=0 and identified_count>=deduplicated_count>=screened_count>=included_count",
          "allowed_outputs": [
            "TRUE"
          ],
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "status",
            "values": [
              "EXECUTED",
              "VERIFIED"
            ]
          }
        }
      ],
      "supersession_constraints": [
        {
          "id": "ITER-SUP",
          "pointer_field": "supersedes_iteration_id",
          "natural_key": [
            "workstream_id",
            "sequence"
          ],
          "timestamp_field": "recorded_at",
          "require_acyclic": true,
          "require_strictly_increasing_timestamp": true,
          "current_definition": "no incoming supersedes_iteration_id",
          "applies_when": {
            "kind": "FIELD_NONEMPTY",
            "field": "supersedes_iteration_id"
          },
          "immutable_fields": [
            "predeclared_at",
            "workstream_id",
            "sequence"
          ]
        }
      ],
      "unique_current_constraints": [
        {
          "id": "ITER-UNIQUE-CURRENT",
          "fields": [
            "workstream_id",
            "sequence"
          ],
          "maximum": 1,
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "ALL",
            "population": "SEARCH_ITERATIONS_ROWS"
          }
        },
        {
          "id": "ITER-CONTIGUOUS",
          "fields": [
            "workstream_id",
            "sequence"
          ],
          "operator": "sequence_contiguous",
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "ALL",
            "population": "SEARCH_ITERATIONS_ROWS"
          }
        }
      ],
      "cross_record_constraints": [
        {
          "id": "ITER-RECONCILIATION",
          "scope": "search iteration",
          "assertions": [
            {
              "operator": "computed_equals",
              "field": "identified_count",
              "expression": "count search_links with search_id in row.search_ids and link_role==RETRIEVED_SOURCE"
            },
            {
              "operator": "computed_equals",
              "field": "deduplicated_count",
              "expression": "count distinct linked source IDs among those RETRIEVED_SOURCE links"
            },
            {
              "operator": "computed_equals",
              "field": "screened_count",
              "expression": "count those distinct sources with a PRIMARY screening event in the same workstream as-of completed_at"
            },
            {
              "operator": "computed_equals",
              "field": "included_count",
              "expression": "count those distinct sources whose current-as-of completed_at PRIMARY decision is INCLUDE"
            }
          ],
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "status",
            "values": [
              "EXECUTED",
              "VERIFIED"
            ]
          }
        }
      ]
    }
  }
}
