          "CSPRNG_256BIT"
        ],
        "selection_rule": [
          "SEEDED_SHA256_LOWEST_V1"
        ],
        "recorded_by_type": "object_actor_type"
      },
      "foreign_keys": {
        "prior_record_id": "screening_precommitments.sample_record_id",
        "workstream_id": "workstreams.workstream_id"
      },
      "multi_value_fields": [
        "eligible_screening_event_ids",
        "selected_screening_event_ids",
        "verification_review_event_ids"
      ],
      "multi_value_foreign_keys": {
        "eligible_screening_event_ids": "screening_events.screening_event_id",
        "selected_screening_event_ids": "screening_events.screening_event_id",
        "verification_review_event_ids": "review_events.review_event_id"
      },
      "canonical_document_foreign_keys": {
        "protocol_object_id": "canonical_document_targets.PROTOCOL"
      },
      "conditional_constraints": [
        {
          "id": "SSP-PRE",
          "when": {
            "record_state": "PRECOMMITTED"
          },
          "assertions": [
            {
              "operator": "require_empty",
              "fields": [
                "prior_record_id",
                "seed_reveal",
                "population_snapshot_commit",
                "eligible_screening_event_ids",
                "population_size",
                "required_sample_size",
                "selected_screening_event_ids",
                "population_manifest_sha256",
                "selection_manifest_sha256",
                "verification_review_event_ids",
                "invalidation_reason"
              ]
            },
            {
              "operator": "require_nonempty",
              "fields": [
                "seed_commitment"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "record_state": "PRECOMMITTED"
            }
          }
        },
        {
          "id": "SSP-MAT",
          "when": {
            "record_state": "MATERIALIZED"
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "prior_record_id",
                "seed_commitment",
                "seed_reveal",
                "population_snapshot_commit",
                "population_size",
                "required_sample_size",
                "population_manifest_sha256",
                "selection_manifest_sha256"
              ]
            },
            {
              "operator": "require_empty",
              "fields": [
                "verification_review_event_ids",
                "invalidation_reason"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "record_state": "MATERIALIZED"
            }
          }
        },
        {
          "id": "SSP-VER",
          "when": {
            "record_state": "VERIFIED"
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "prior_record_id",
                "seed_commitment",
                "seed_reveal",
                "population_snapshot_commit",
                "population_size",
                "required_sample_size",
                "population_manifest_sha256",
                "selection_manifest_sha256",
                "verification_review_event_ids"
              ]
            },
            {
              "operator": "require_empty",
              "fields": [
                "invalidation_reason"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "record_state": "VERIFIED"
            }
          }
        },
        {
          "id": "SSP-INVALID",
          "when": {
            "record_state": "INVALIDATED"
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "prior_record_id",
                "invalidation_reason"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "record_state": "INVALIDATED"
            }
          }
        },
        {
          "id": "SSP-ACTOR-HUMAN",
          "when": {
            "recorded_by_type": "HUMAN"
          },
          "assertions": [
            {
              "operator": "require_values",
              "values": {
                "recorded_by_system": "NOT_APPLICABLE"
              }
            },
            {
              "operator": "require_nonempty",
              "fields": [
                "record_context_locator"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "recorded_by_type": "HUMAN"
            }
          }
        },
        {
          "id": "SSP-ACTOR-AI",
          "when": {
            "recorded_by_type": [
              "HUMAN_AI_HYBRID",
              "AI"
            ]
          },
          "assertions": [
            {
              "operator": "require_nonempty",
              "fields": [
                "recorded_by_system",
                "record_context_locator"
              ]
            },
            {
              "operator": "forbid_values",
              "values": {
                "recorded_by_system": [
                  "NOT_APPLICABLE"
                ],
                "record_context_locator": [
                  "NOT_APPLICABLE"
                ]
              }
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "recorded_by_type": [
                "HUMAN_AI_HYBRID",
                "AI"
              ]
            }
          }
        }
      ],
      "computed_constraints": [
        {
          "id": "SSP-SAMPLE-SIZE",
          "target": "required_sample_size",
          "expression": "0 when population_size==0; otherwise min(population_size,max(1,ceil(2000*population_size/10000)))",
          "allowed_outputs": [
            "INTEGER"
          ],
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "record_state",
            "values": [
              "MATERIALIZED",
              "VERIFIED"
            ]
          }
        },
        {
          "id": "SSP-SEED-COMMITMENT",
          "target": "seed_commitment",
          "expression": "lowercase_sha256_utf8('SSP-COMMIT-V1|'+sample_plan_id+'|'+workstream_id+'|'+stage+'|'+protocol_object_id+'|'+population_cutoff_at+'|PRIMARY_EXCLUSION_AS_OF_CUTOFF_V1|CSPRNG_256BIT|SEEDED_SHA256_LOWEST_V1|2000|1|'+seed_reveal)",
          "allowed_outputs": [
            "SHA256"
          ],
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "record_state",
            "values": [
              "MATERIALIZED",
              "VERIFIED"
            ]
          }
        },
        {
          "id": "SSP-POPULATION-MANIFEST",
          "target": "population_manifest_sha256",
          "expression": "SHA-256 UTF-8 of LF-joined eligible-event lines in ASCII event-ID order, no terminal LF; line='SSP-POP-V1|event_id|workstream|source|stage|decision|review_role|status|reviewed_at'; empty set hashes empty bytes",
          "allowed_outputs": [
            "SHA256"
          ],
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "record_state",
            "values": [
              "MATERIALIZED",
              "VERIFIED"
            ]
          }
        },
        {
          "id": "SSP-SELECTION-MANIFEST",
          "target": "selection_manifest_sha256",
          "expression": "For each eligible event selection_key=lowercase_sha256_utf8('SSP-SELECT-V1|'+seed_reveal+'|'+sample_plan_id+'|'+workstream_id+'|'+source_id+'|'+stage+'|'+protocol_object_id); sort by (selection_key,event_id), take required_sample_size, then hash LF-joined lines 'SSP-SEL-V1|rank|selection_key|event_id' with no terminal LF; empty set hashes empty bytes",
          "allowed_outputs": [
            "SHA256"
          ],
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "record_state",
            "values": [
              "MATERIALIZED",
              "VERIFIED"
            ]
          }
        }
      ],
      "supersession_constraints": [
        {
          "id": "SSP-CHAIN",
          "pointer_field": "prior_record_id",
          "natural_key": [
            "sample_plan_id"
          ],
          "require_acyclic": true,
          "require_strictly_increasing_timestamp": true,
          "timestamp_field": "recorded_at",
          "permitted_transitions": [
            "PRECOMMITTED>MATERIALIZED",
            "MATERIALIZED>VERIFIED",
            "PRECOMMITTED>INVALIDATED",
            "MATERIALIZED>INVALIDATED",
            "VERIFIED>INVALIDATED"
          ],
          "append_only": true,
          "terminal_states": [
            "INVALIDATED"
          ],
          "applies_when": {
            "kind": "FIELD_NONEMPTY",
            "field": "prior_record_id"
          }
        }
      ],
      "unique_current_constraints": [
        {
          "id": "SSP-ONE-PRE",
          "fields": [
            "sample_plan_id"
          ],
          "filter": {
            "record_state": "PRECOMMITTED"
          },
          "exactly": 1,
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "ALL",
            "population": "SAMPLE_PLAN"
          }
        },
        {
          "id": "SSP-MAX-MAT",
          "fields": [
            "sample_plan_id"
          ],
          "filter": {
            "record_state": "MATERIALIZED"
          },
          "maximum": 1,
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "ALL",
            "population": "SAMPLE_PLAN"
          }
        },
        {
          "id": "SSP-MAX-VER",
          "fields": [
            "sample_plan_id"
          ],
          "filter": {
            "record_state": "VERIFIED"
          },
          "maximum": 1,
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "ALL",
            "population": "SAMPLE_PLAN"
          }
        },
        {
          "id": "SSP-MAX-INVALID",
          "fields": [
            "sample_plan_id"
          ],
          "filter": {
            "record_state": "INVALIDATED"
          },
          "maximum": 1,
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "ALL",
            "population": "SAMPLE_PLAN"
          }
        },
        {
          "id": "SSP-LINEAR",
