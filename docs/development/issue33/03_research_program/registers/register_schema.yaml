          "note": "Row identity is the version for immutable register rows and canonical documents; synthesis and topology use their explicit version fields.",
          "applies_when": {
            "kind": "ALWAYS"
          }
        },
        {
          "id": "RVE-AUTHOR-MATCH",
          "scope": "review event",
          "assertions": [
            {
              "operator": "target_metadata_matches",
              "metadata_key": "author_fields"
            }
          ],
          "note": "Required for the eight double-reviewed pilot object types.",
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "object_type",
            "values": [
              "CLAIM",
              "EVIDENCE_LINK",
              "CLAIM_ASSESSMENT",
              "MATERIALITY_ASSESSMENT",
              "ROOTNESS_ASSESSMENT",
              "EQUALITY_ASSESSMENT",
              "SYNTHESIS",
              "TOPOLOGY_RELATION",
              "SCREENING_SAMPLE_RECORD"
            ]
          }
        },
        {
          "id": "RVE-PILOT-DOUBLE-COVERAGE",
          "scope": "review event set",
          "assertions": [
            {
              "operator": "exact_count",
              "computed": "current COMPLETED initial review slots per immutable object tuple and workstream",
              "count": 2
            },
            {
              "operator": "exact_profile_role_set",
              "profile": "PILOT-MANIFEST-0.3",
              "workstream_field": "workstream_id",
              "role_field": "reviewer_role"
            },
            {
              "operator": "all_distinct",
              "values": [
                "reviewer_context_locator"
              ]
            },
            {
              "operator": "target_field_in",
              "field": "reviewer_procedurally_independent",
              "allowed": [
                "TRUE"
              ]
            },
            {
              "operator": "exists_count",
              "where": {
                "reviewer_role": [
                  "R-ADJUDICATION",
                  "H-DECISION"
                ]
              },
              "maximum": 0
            }
          ],
          "note": "Applies to every object in the manifest's double_review_object_types; both slots are independently TRUE.",
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "PILOT-MANIFEST-0.3",
            "population": "DOUBLE_REVIEW_OBJECTS_BY_WORKSTREAM"
          }
        },
        {
          "id": "RVE-ADJUDICATION-DISTINCT",
          "scope": "adjudication event",
          "assertions": [
            {
              "operator": "exact_count",
              "set": "adjudicates_review_event_ids",
              "count": 2
            },
            {
              "operator": "same_object_tuple",
              "references": "adjudicates_review_event_ids",
              "include_row": true,
              "tuple": [
                "workstream_id",
                "object_type",
                "object_id",
                "object_version",
                "object_digest_sha256"
              ]
            },
            {
              "operator": "current_head",
              "references": "adjudicates_review_event_ids"
            },
            {
              "operator": "target_status_in",
              "references": "adjudicates_review_event_ids",
              "allowed": [
                "COMPLETED"
              ]
            },
            {
              "operator": "target_field_in",
              "references": "adjudicates_review_event_ids",
              "field": "reviewer_role",
              "allowed": [
                "R-METHOD",
                "R-EVIDENCE",
                "R-CONTEXT"
              ]
            },
            {
              "operator": "all_distinct",
              "values": [
                "reviewer_context_locator",
                "referenced reviewer_context_locator values",
                "object_author_context_locator"
              ]
            },
            {
              "operator": "field_not_equal",
              "left": "reviewer",
              "right": "each referenced reviewer",
              "applies_when": {
                "kind": "EXPRESSION_IN",
                "expression": "row.reviewer_type",
                "values": [
                  "HUMAN",
                  "HUMAN_AI_HYBRID"
                ]
              }
            }
          ],
          "applies_when": {
            "kind": "FIELD_EQUALS",
            "field": "reviewer_role",
            "value": "R-ADJUDICATION"
          }
        },
        {
          "id": "RVE-OBJECT-DIGEST",
          "scope": "review event",
          "assertions": [
            {
              "operator": "sha256_canonical_equals",
              "field": "object_digest_sha256",
              "serialization": "UTF-8 bytes of the target table's exact declared header, one LF, the exact target row in declared header order with minimal RFC 4180 quoting, and no terminal line ending"
            }
          ],
          "note": "A content change changes the digest and requires renewed double review; review events never migrate to a new row identity, version, or digest.",
          "applies_when": {
            "kind": "ALWAYS"
          }
        },
        {
          "id": "RVE-OBJECT-WORKSTREAM",
          "scope": "review event",
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "object_type",
            "values": [
              "CLAIM",
              "EVIDENCE_LINK",
              "CLAIM_ASSESSMENT",
              "MATERIALITY_ASSESSMENT",
              "ROOTNESS_ASSESSMENT",
              "EQUALITY_ASSESSMENT",
              "SYNTHESIS",
              "TOPOLOGY_RELATION",
              "SCREENING_SAMPLE_RECORD"
            ]
          },
          "assertions": [
            {
              "operator": "target_field_in",
              "field": "workstream_id",
              "computed_allowed": "resolved target workstream IDs: direct claim/synthesis/sample; via claim for EVL/ASM; via candidate for MAT/ROT; via assessed object for EQA; union of endpoint claim/candidate workstreams for TOP"
            }
          ]
        }
      ]
    },
