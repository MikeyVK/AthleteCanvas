              "operator": "exact_multi_set",
              "field": "current_claim_assessment_ids",
              "computed": "one current VERIFIED|CHALLENGED ASM for every claim_id; no other ASM"
            },
            {
              "operator": "current_head",
              "references": "current_claim_assessment_ids"
            },
            {
              "operator": "target_status_in",
              "references": "current_claim_assessment_ids",
              "allowed": [
                "VERIFIED",
                "CHALLENGED"
              ]
            },
            {
              "operator": "same_value",
              "references": "current_claim_assessment_ids",
              "field": "claim_id",
              "set_equals_row_field": "claim_ids"
            }
          ],
          "note": "Applies from candidate status UNDER_REVIEW onward.",
          "applies_when": {
            "kind": "FIELD_IN",
            "field": "status",
            "values": [
              "UNDER_REVIEW",
              "TOPOLOGY_REVIEW",
              "RETAINED",
              "MERGED",
              "RECLASSIFIED",
              "HELD",
              "CORRECTED",
              "REJECTED"
            ]
          }
        },
        {
          "id": "KAND-NONE-COUNTEREVIDENCE",
