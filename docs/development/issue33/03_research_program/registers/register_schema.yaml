            },
            {
              "operator": "target_field_equals",
              "references": "current_equality_assessment_id",
              "field": "object_id",
              "equals_row_field": "candidate_id"
            },
            {
              "operator": "target_field_in",
              "references": "current_equality_assessment_id",
              "field": "overall_status",
              "mapping_from_row_field": {
                "equality_relevance": {
                  "NOT_APPLICABLE": [
