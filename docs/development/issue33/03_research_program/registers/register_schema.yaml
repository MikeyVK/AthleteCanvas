{
  "schema_version": "0.4",
  "protocol_version": "0.1",
  "format_note": "JSON syntax valid under YAML 1.2. Consumers must enforce foreign_keys, multi_value_foreign_keys, polymorphic_foreign_keys, canonical_document_foreign_keys, multi_value_enums, conditional_constraints, supersession_constraints, unique_current_constraints, computed_constraints, cross_record_constraints, and every explicit applies_when predicate.",
  "csv_dialect": {
    "encoding": "UTF-8",
    "delimiter": ",",
    "quote": "\"",
    "multi_value_delimiter": "|",
    "header_required": true
  },
  "scalar_types": {
    "string": "UTF-8 text after CSV decoding",
    "boolean": "Literal TRUE or FALSE",
    "integer": "Base-10 integer without separators",
    "date": "ISO 8601 calendar date YYYY-MM-DD",
    "datetime": "RFC 3339 UTC timestamp ending Z; fractional seconds allowed",
    "sha256": "Exactly 64 lowercase hexadecimal characters",
    "hex256": "Exactly 64 lowercase hexadecimal characters",
    "git_commit": "Exactly 40 or 64 lowercase hexadecimal characters"
  },
  "null_semantics": {
    "blank": "Missing or not yet entered",
    "NOT_ASSESSED": "Explicit workflow state: no assessment performed",
    "UNKNOWN": "Assessed but evidence cannot determine the value",
    "NOT_APPLICABLE": "Field has no semantic application",
    "NONE_IDENTIFIED": "The declared search or check was performed and found no instance"
  },
  "constraint_language": {
    "version": "YPSIA-REGISTER-CONSTRAINTS-1",
    "evaluation_order": [
      "shape_and_scalar_types",
      "foreign_keys",
      "conditional_constraints",
      "supersession_constraints",
      "unique_current_constraints",
      "computed_constraints",
      "cross_record_constraints"
    ],
    "empty_values": [
      "",
      null
    ],
    "multi_value_semantics": "Pipe-delimited members are trimmed, nonempty, unique, and validated member-by-member; order is significant only where a rule says so.",
    "current_row_definition": "A row is current when no row in the same table points to its primary key through the declared supersession pointer; a status label cannot override this graph-derived definition.",
    "as_of_definition": "current_as_of(table,time) applies the same incoming-superseder rule using only rows whose event timestamp is <= time.",
    "operators": {
      "require_nonempty": "Every named field is neither blank nor null.",
      "require_empty": "Every named field is blank or null.",
      "require_values": "Each named field equals its declared scalar value.",
      "allow_values": "Each named field belongs to the declared set.",
      "forbid_values": "Each named field does not belong to the declared set.",
      "require_at_least_one_nonempty": "At least one named field is nonempty.",
      "field_not_equal": "The two named fields are not equal.",
      "multi_min_items": "The named multi-value field has at least the declared number of unique members.",
      "exact_multi_set": "The named multi-value field equals the computed set, ignoring order unless ordered=true.",
      "same_value": "All referenced records have the same declared value.",
      "subset_of": "The left multi-value set is a subset of the right set.",
      "current_head": "Every referenced record is graph-current.",
      "target_status_in": "Every referenced target has an allowed status.",
      "target_field_in": "Every referenced target field has an allowed value.",
      "target_field_equals": "Every referenced target field equals the declared row field or value.",
      "approved_decision": "The decision ID resolves to an Approved entry in DECISION_LOG.md.",
      "count_compare": "Evaluate the declared integer comparison.",
      "computed_equals": "The target field equals the deterministic expression result.",
      "sha256_canonical_equals": "The named digest equals lowercase SHA-256 of the declared canonical UTF-8 serialization.",
      "strict_ancestor_commit": "The first Git commit is a strict ancestor of the second.",
      "immutable_equal_to_prior": "All named fields byte-equal the prior chain record.",
      "exact_count": "The computed set or rows has exactly the declared count.",
      "exists_count": "The computed or referenced set has exactly, at least, or at most the declared count; exactly is mutually exclusive with minimum/maximum.",
      "all_distinct": "All named values or computed values are pairwise distinct.",
      "sequence_contiguous": "Current sequence values for a natural-key group are exactly 1..max without gaps.",
      "later_than": "The first timestamp is strictly later than the second.",
      "earlier_or_equal": "The first timestamp is no later than the second.",
      "value_not_in_set": "The named scalar value is unequal to every member of the computed set.",
      "target_metadata_matches": "Review-event author fields equal the target table's declared author_fields mapping.",
      "exact_profile_role_set": "The current qualifying events use exactly the initial_review_roles assigned to the event workstream in the named pilot profile.",
      "same_object_tuple": "All referenced review or screening events resolve to the same declared immutable object tuple.",
      "linear_chain": "Within a natural-key group every noninitial row has exactly one prior row and every row has at most one direct successor.",
      "earlier_than": "The first timestamp is strictly earlier than the second.",
      "late_event_invalidation": "For a VERIFIED plan, compute invalidating PRIMARY events as reviewed_at after cutoff OR introduced after snapshot with backdated data that changes the cutoff population. Empty set permits continued use. Nonempty set requires exactly one direct INVALIDATED successor before any further sample-secondary event, and a replacement plan before release resumes."
    },
    "predicate_grammar": {
      "rule": "Every constraint carries applies_when. Missing applies_when is invalid.",
      "always": {
        "kind": "ALWAYS"
      },
      "row_field_equals": {
        "kind": "FIELD_EQUALS",
        "field": "column",
        "value": "scalar"
      },
      "row_field_in": {
        "kind": "FIELD_IN",
        "field": "column",
        "values": [
          "scalar"
        ]
      },
      "field_nonempty": {
        "kind": "FIELD_NONEMPTY",
        "field": "column"
      },
      "field_empty": {
        "kind": "FIELD_EMPTY",
        "field": "column"
      },
      "all": {
        "kind": "ALL",
        "predicates": [
          "predicate"
        ]
      },
      "any": {
        "kind": "ANY",
        "predicates": [
          "predicate"
        ]
      },
      "not": {
        "kind": "NOT",
        "predicate": "predicate"
      },
      "aggregate": {
        "kind": "AGGREGATE",
        "profile": "profile id",
        "population": "deterministic population id"
      },
      "conditional_when": "Inside conditional_constraints, ordinary object keys are ANDed; a scalar is equality, an array is membership, {not:{...}} negates, {all:[...]} is conjunction, {any:[...]} is disjunction, and {field_nonempty:'x'} or {field_empty:'x'} tests null state.",
      "expression_in": {
        "kind": "EXPRESSION_IN",
        "expression": "declared row or referenced-record expression",
        "values": [
          "scalar"
        ]
      }
    },
    "operator_semantics": {
      "value_not_in_set": "The named scalar value is unequal to every member of the computed set.",
      "target_metadata_matches": "Review-event author fields equal the target table's declared author_fields mapping.",
      "exact_profile_role_set": "The current qualifying events use exactly the initial_review_roles assigned to the event workstream in the named pilot profile.",
      "same_object_tuple": "All referenced review or screening events resolve to the same declared immutable object tuple.",
      "linear_chain": "Within a natural-key group every noninitial row has exactly one prior row and every row has at most one direct successor."
    },
    "assertion_applicability": "An assertion may carry its own applies_when predicate; otherwise it inherits the enclosing constraint's applies_when. Informative scope and note text never change applicability."
  },
