          }
        },
        {
          "id": "KAND-COUNTEREVIDENCE-RECORDED",
          "when": {
            "all": [
              {
                "status": [
                  "UNDER_REVIEW",
                  "TOPOLOGY_REVIEW",
                  "RETAINED",
                  "MERGED",
                  "RECLASSIFIED",
                  "HELD",
                  "CORRECTED",
                  "REJECTED"
                ]
              },
              {
                "field_nonempty": "strongest_counterevidence_summary"
              },
              {
                "not": {
                  "strongest_counterevidence_summary": "NONE_IDENTIFIED"
                }
              }
            ]
          },
          "assertions": [
            {
              "operator": "require_at_least_one_nonempty",
              "fields": [
                "strongest_counterclaim_ids",
                "strongest_counterevidence_link_ids"
              ]
            }
          ],
          "applies_when": {
            "kind": "CONDITIONAL_WHEN",
            "predicate": {
              "all": [
                {
                  "status": [
                    "UNDER_REVIEW",
                    "TOPOLOGY_REVIEW",
                    "RETAINED",
                    "MERGED",
                    "RECLASSIFIED",
                    "HELD",
                    "CORRECTED",
                    "REJECTED"
                  ]
                },
                {
                  "field_nonempty": "strongest_counterevidence_summary"
                },
                {
                  "not": {
                    "strongest_counterevidence_summary": "NONE_IDENTIFIED"
