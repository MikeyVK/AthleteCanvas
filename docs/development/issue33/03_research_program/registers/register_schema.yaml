              "stage_field": "stage",
              "cutoff_field": "population_cutoff_at",
              "snapshot_field": "population_snapshot_commit",
              "successor_state": "INVALIDATED"
            }
          ],
          "applies_when": {
            "kind": "AGGREGATE",
            "profile": "PILOT-MANIFEST-0.3",
            "population": "VERIFIED_SAMPLE_PLAN"
          }
        },
        {
          "id": "SSP-PRE-BEFORE-CUTOFF",
          "scope": "PRECOMMITTED sample record",
          "applies_when": {
            "kind": "FIELD_EQUALS",
            "field": "record_state",
            "value": "PRECOMMITTED"
          },
          "assertions": [
            {
              "operator": "earlier_than",
              "left": "recorded_at",
              "right": "population_cutoff_at"
            }
          ]
        }
      ],
