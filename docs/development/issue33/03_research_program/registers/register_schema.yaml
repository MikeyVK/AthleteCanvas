  "validation_contract": {
    "empty_baseline_state": "PRELIMINARY",
    "evidence_collection_gate": [
      "All 23 CSV headers exactly match the declared columns.",
      "Every foreign-key and enum target resolves.",
      "Every conditional, supersession, uniqueness, computed, and cross-record constraint has an executable validator implementation.",
      "For every constraint ID at least one positive fixture is accepted and at least one single-fault negative fixture is rejected.",
      "Protocol 0.1 and Pilot Manifest 0.3 canonical document targets resolve.",
      "No evidence row may be entered until the five proposed decisions are Approved and this gate is recorded as passed."
    ],
    "checkpoint_owner": "../BASELINE_AUDIT.md",
    "checkpoint_required_fields": [
      "schema_sha256",
      "validator_version",
      "constraint_ids_tested",
      "positive_fixture_count",
      "negative_fixture_count",
      "passed",
      "recorded_at",
      "recorded_by",
      "authorised_execution_role",
      "seed_custodian_assignment_status"
    ],
    "role_assignment_gate": "Before PRECOMMITTED is introduced, H-DECISION records the authorised Git execution role and seed-custodian identity/context in STATUS; the PRECOMMITTED row becomes the canonical custodian record."
  },
